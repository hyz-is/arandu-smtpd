# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these four lines with what the code calls.

name = "hyz-is/smtpd"
# This package imports no framework package and no Arandu module: it needs the
# Go standard library and nothing else, so any Framework release can host it.
framework = ">= 0.66"
profiles = ["conventional", "performance"]

[permissions]
# It listens for SMTP connections on the addresses the application gives it and
# answers on them. It dials nothing.
network = true
# It reads the TLS certificate and key files the application names when it is
# asked to reload them (CertReloader); it writes no file.
filesystem = true
# It runs no other program.
exec = false
# It owns no table: a connection is state in memory for as long as it lasts.
migrations = false
